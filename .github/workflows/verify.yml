name: flush-partial-write-verify
on:
  workflow_dispatch:
    inputs:
      variant:
        description: "red (upstream nats.go) or green (fixed nats.go)"
        required: true
        type: string

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout upstream nats.go at pinned SHA
        uses: actions/checkout@v4
        with:
          repository: nats-io/nats.go
          ref: 5adc9d5d34ce8e3b7b8b002c5bd502a8b7a323d3
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Overlay files (via API, no raw CDN caching)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VARIANT=${{ inputs.variant }}
          fetch() {
            gh api "repos/CodeAlex52/nats-flush-verify/contents/overlay/$1?ref=main" --jq .content | base64 -d
          }
          if [ "$VARIANT" = "green" ]; then
            fetch nats_fixed.go > nats.go
          else
            fetch nats_upstream.go > nats.go
          fi
          fetch nats_flush_test.go > nats_flush_test.go
      - name: Run partial-write flush regression test
        run: |
          set -euo pipefail
          go test . -run TestFlushRetriesPartialWrite -v 2>&1 | tee flush-test.log
